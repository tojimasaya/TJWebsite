<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
  <title id="title">連立式天守の配置と屋根のつながり</title>
  <desc id="desc">北を上に、大天守を南東、乾小天守を北西、東小天守を北東、西小天守を南西に配置。北のロ、西のハ、東のイ、南のニの渡櫓が中庭を囲む。形状と寸法を簡略化した屋根伏せの模式図。</desc>
  <defs>
    <pattern id="tiles" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M.5 0V7" stroke="#76818a" stroke-width=".65"/>
      <path d="M0 6.5H7" stroke="#a9b1b6" stroke-width=".45"/>
    </pattern>
    <pattern id="stone" width="32" height="24" patternUnits="userSpaceOnUse">
      <rect width="32" height="24" fill="#f1f2ef"/>
      <path d="M0 0H32M0 12H32M0 24H32M8 0V12M24 12V24" stroke="#c5c9c6" stroke-width=".8"/>
    </pattern>
    <g id="small-roof" stroke="#455159" stroke-linejoin="round">
      <rect x="-62" y="-62" width="124" height="124" fill="#eef0ed" stroke-width="1.4"/>
      <path d="M-67-58H67V58H-67Z" fill="#cdd3d6" stroke-width="2"/>
      <path d="M-67-58H67V58H-67Z" fill="url(#tiles)" stroke="none"/>
      <path d="M-67-58-42-35H42L67-58M-67 58-42 35H42L67 58" fill="none"/>
      <path d="M-47-39H47V39H-47Z" fill="#f7f8f6" stroke-width="2"/>
      <path d="M-51-34H51V34H-51Z" fill="#ccd2d5" stroke-width="1.5"/>
      <path d="M-51-34H51V34H-51Z" fill="url(#tiles)" stroke="none"/>
      <path d="M-51-34-28-17H28L51-34M-51 34-28 17H28L51 34" fill="none"/>
      <path d="M-32-20H32V20H-32Z" fill="#fafbf9" stroke-width="2"/>
      <path d="M-37-16H37V16H-37Z" fill="#abb6bc" stroke-width="1.5"/>
      <path d="M-37-16H37V16H-37Z" fill="url(#tiles)" stroke="none"/>
      <path d="M-37-16-23 0-37 16M37-16 23 0 37 16M-26 0H26" fill="none" stroke-width="2"/>
      <path d="M-28-3H28V3H-28Z" fill="#f9faf8"/>
    </g>
  </defs>
  <rect width="600" height="640" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" fill="#293b40">
    <g transform="translate(301 35)">
      <path d="M0 28V-7M-7 4 0-7 7 4" fill="none" stroke="#293b40" stroke-width="2"/>
      <text x="20" y="10" font-size="22">北</text>
    </g>
    <!-- Roof plan: the four keeps and passage ring, not a measured survey. -->
    <path d="M57 92H541V502H303V466H64Z" fill="url(#stone)" stroke="#9da7a6" stroke-width="1.5"/>
    <path d="M155 211H410V372H160Z" fill="#ecf3ed" stroke="#91a799" stroke-width="1.2"/>
    <g stroke="#52616a" stroke-width="1.5" fill="#dfe5e6">
      <path d="M151 139H449V184H151Z"/>
      <path d="M102 180H151V395H102Z"/>
      <path d="M444 175H492V374H444Z"/>
      <path d="M143 395H383V440H143Z"/>
    </g>
    <g fill="url(#tiles)">
      <path d="M151 139H449V184H151Z"/>
      <path d="M102 180H151V395H102Z"/>
      <path d="M444 175H492V374H444Z"/>
      <path d="M143 395H383V440H143Z"/>
    </g>
    <g fill="none" stroke="#f9faf9" stroke-width="4">
      <path d="M151 161H449M126 180V395M468 175V374M143 417H383"/>
    </g>
    <g fill="none" stroke="#455159" stroke-width="1.3">
      <path d="M151 161H449M126 180V395M468 175V374M143 417H383"/>
    </g>
    <use href="#small-roof" transform="translate(124 155)"/>
    <use href="#small-roof" transform="translate(467 157) scale(.86)"/>
    <use href="#small-roof" transform="translate(129 405) scale(.87)"/>
    <!-- Main keep: nested eaves and ridgelines are legible separately from labels. -->
    <g stroke="#455159" stroke-width="1.5" stroke-linejoin="round">
      <path d="M316 305H539V494H316Z" fill="#f6f7f5"/>
      <path d="M304 316H552V482H304Z" fill="#c7cfd3" stroke-width="2"/>
      <path d="M304 316H552V482H304Z" fill="url(#tiles)" stroke="none"/>
      <path d="M304 316 337 340M552 316 519 340M304 482 337 458M552 482 519 458" fill="none"/>
      <rect x="334" y="335" width="189" height="128" fill="#f7f8f5"/>
      <path d="M322 344H535V453H322Z" fill="#c7cfd3"/>
      <path d="M322 344H535V453H322Z" fill="url(#tiles)" stroke="none"/>
      <path d="M322 344 350 361M535 344 507 361M322 453 350 438M535 453 507 438" fill="none"/>
      <rect x="351" y="359" width="154" height="82" fill="#f7f8f5"/>
      <path d="M341 366H516V433H341Z" fill="#bcc6cd"/>
      <path d="M341 366H516V433H341Z" fill="url(#tiles)" stroke="none"/>
      <path d="M341 366 373 383M516 366 484 383M341 433 373 416M516 433 484 416" fill="none"/>
      <rect x="372" y="379" width="112" height="40" fill="#f8f9f6" stroke-width="2"/>
      <path d="M362 385H494V413H362Z" fill="#aab7bf"/>
      <path d="M362 385H494V413H362Z" fill="url(#tiles)" stroke="none"/>
      <path d="M362 385 382 399 362 413M494 385 474 399 494 413" fill="none"/>
      <path d="M379 396H477V402H379Z" fill="#fff"/>
    </g>
    <!-- Labels sit outside the roof footprints. -->
    <g font-size="30" font-weight="600">
      <text x="123" y="65" text-anchor="middle">乾小天守</text>
      <text x="468" y="65" text-anchor="middle">東小天守</text>
      <text x="124" y="520" text-anchor="middle">西小天守</text>
      <text x="431" y="537" text-anchor="middle" fill="#a82f2b">大天守</text>
    </g>
    <g stroke="#77878d" fill="none" stroke-width="1.5">
      <path d="M124 74V93M468 74V108M124 469V493M431 495V512"/>
    </g>
    <g font-size="27" text-anchor="middle">
      <text x="297" y="122">ロの渡櫓</text>
      <text x="268" y="289" fill="#456b58">中庭</text>
      <text x="241" y="475">ニの渡櫓</text>
      <text x="53" y="289" transform="rotate(-90 53 289)">ハの渡櫓</text>
      <text x="550" y="260" transform="rotate(90 550 260)">イの渡櫓</text>
    </g>
    <path d="M180 577H420" stroke="#cbd2d2"/>
    <text x="300" y="609" text-anchor="middle" font-size="20" fill="#55636b">北が上 / 屋根伏せ模式図・縮尺なし</text>
  </g>
</svg>
