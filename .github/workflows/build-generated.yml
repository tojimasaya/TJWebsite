name: Build generated pages

# 生成物（手で編集しないファイル）をまとめて作り直して auto-commit する。
#   - 白鷺三十六景の一景ページ shirasagi36/noNN*.html ・ data/shirasagi-latest.json
#   - 断章の個別ページ fragments/*.html
#   - 香港ハンドブックの共通フレーム（前提・更新履歴・関連ガイド）と hub のカード一覧
#   - 祝日カレンダーの calendars/*.ics と holidays.html のダウンロード導線
#   - 共有カード assets/og/cards/*.jpg（三十六景 105 枚・断章 24 枚。Pillow で描画）
#   - フィード feed.xml / feed-fragments.xml / feed.json ・ data/updates.json ・ rss/index.html
#   - sitemap.xml のマーカー区間（三十六景・断章）と hub の全景一覧
# 三つの生成器が sitemap.xml を共有するため、ワークフローは 1 本にまとめて競合を避けている。
# ローカルでは `node tools/build-shirasagi.mjs && node tools/build-fragments.mjs && node tools/build-feeds.mjs`。
on:
  push:
    branches: [main]
    paths:
      - 'assets/images/shirasagi/photos.json'
      - 'assets/images/shirasagi/photos-en.json'
      - 'assets/images/shirasagi/photos-hk.json'
      - 'data/recent-photos.json'
      - 'data/articles.json'
      - 'data/handbook.json'
      - 'data/holidays-2026.json'
      - 'data/holidays-2027.json'
      - 'articles/**'
      - 'tools/build-shirasagi.mjs'
      - 'tools/build-fragments.mjs'
      - 'tools/build-feeds.mjs'
      - 'tools/build-handbook.mjs'
      - 'tools/build-og.py'
      - 'tools/build-ics.mjs'
      - 'tools/lib/html.mjs'
      - 'tools/templates/shirasagi-view.html'
      - 'tools/templates/fragment.html'
      - '.github/workflows/build-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-generated
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OG card tooling (Pillow + Noto Serif CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --quiet --upgrade pillow

      - name: Build OG cards (X / LINE / Facebook のカード画像)
        run: python3 tools/build-og.py

      - name: Build one-page-per-view HTML (白鷺三十六景)
        run: node tools/build-shirasagi.mjs

      - name: Build fragment pages (断章)
        run: node tools/build-fragments.mjs

      - name: Build handbook frame (香港ハンドブック)
        run: node tools/build-handbook.mjs

      - name: Build holiday calendars (ICS)
        run: node tools/build-ics.mjs

      - name: Build feeds and updates.json
        run: node tools/build-feeds.mjs

      - name: Validate HTML (links / meta / hreflang / sitemap)
        run: node tools/validate-growth-html.mjs

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(build): rebuild generated pages and feeds'
          file_pattern: 'shirasagi36/*.html fragments/*.html calendars/*.ics assets/og/cards/*.jpg data/shirasagi-latest.json data/updates.json feed.xml feed-fragments.xml feed.json rss/index.html sitemap.xml shirasagi36.html shirasagi36-en.html shirasagi36-hk.html hongkong-handbook.html holidays.html hk-*.html cn-*.html gear-sim.html'
