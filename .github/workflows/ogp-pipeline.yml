name: OGP scrape & cache

on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'   # 毎日、記事画像をサイト内へキャッシュ

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm --yes install cheerio node-fetch@3

      - name: Run OGP pipeline
        run: node tools/ogp-pipeline.mjs

      - name: Rebuild feeds (articles.json の更新は他の workflow を起こさないためここで実行)
        run: node tools/build-feeds.mjs

      - name: Debug — list cached images
        run: ls -la assets/og/ || echo "No og directory"

      - name: Stage cached images explicitly
        run: git add -f assets/og/ || true

      - name: Commit JSON and cached images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ogp): scrape & cache thumbnails'
          file_pattern: 'data/writings-og.json data/articles.json data/updates.json feed.xml feed-fragments.xml feed.json'
