name: Build shirasagi36 pages

# 白鷺三十六景の一景ページ（shirasagi36/noNN*.html）・data/shirasagi-latest.json・sitemap.xml の
# 三十六景区間・hub の全景一覧を、photos*.json から再生成して auto-commit する。
# ローカルでは `node tools/build-shirasagi.mjs`。生成物は手で編集しない。
on:
  push:
    branches: [main]
    paths:
      - 'assets/images/shirasagi/photos.json'
      - 'assets/images/shirasagi/photos-en.json'
      - 'assets/images/shirasagi/photos-hk.json'
      - 'tools/build-shirasagi.mjs'
      - 'tools/lib/html.mjs'
      - 'tools/templates/shirasagi-view.html'
      - '.github/workflows/build-shirasagi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build one-page-per-view HTML
        run: node tools/build-shirasagi.mjs

      - name: Validate HTML (links / meta / hreflang / sitemap)
        run: node tools/validate-growth-html.mjs

      - name: Commit generated pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(shirasagi36): rebuild one-page-per-view HTML'
          file_pattern: 'shirasagi36/*.html data/shirasagi-latest.json sitemap.xml shirasagi36.html shirasagi36-en.html shirasagi36-hk.html'
