<body class="gear-catalog-page">
    <!-- Navigation will be injected by site-header.js -->

    <main>
        <header class="catalog-hero">
            <a href="gear.html" class="catalog-back">← Gearのカテゴリ一覧</a>
            <h1>Daily Drivers</h1>
            <p class="catalog-lead">撮る、書く、編集する。日々の制作で使っている道具。</p>
        </header>

        <section class="gear-catalog" aria-labelledby="catalog-title">
            <div class="catalog-toolbar">
                <h2 id="catalog-title">所有している道具 <span class="catalog-count" id="catalog-count" role="status"></span></h2>
                <div class="catalog-filters" role="group" aria-label="道具の絞り込み">
                    <button type="button" data-gear-filter="all" aria-pressed="true" aria-controls="editing-grid" disabled>すべて <span id="filter-all-count"></span></button>
                    <button type="button" data-gear-filter="reviews" aria-pressed="false" aria-controls="editing-grid" disabled>レビューあり <span id="filter-review-count"></span></button>
                </div>
            </div>
            <p class="catalog-hint">使い方や選んだ理由は「解説を読む」から。自分で書いたレビューには記事数を添えています。</p>
            <div class="catalog-grid" id="editing-grid" data-gear-category="editing" aria-busy="true">
                <p class="catalog-message">道具を読み込んでいます…</p>
            </div>
            <noscript><p class="catalog-message">道具の一覧を表示するには、JavaScriptを有効にしてください。</p></noscript>
            <p class="catalog-disclosure">※ 本ページの商品リンクには広告（Amazonアソシエイト）を含みます。</p>
        </section>
    </main>

    <dialog class="gear-detail" id="gear-detail" aria-labelledby="gear-detail-context">
        <div class="gear-detail__bar">
            <span id="gear-detail-context">道具の記録</span>
            <button class="gear-detail__close" type="button" data-gear-close>閉じる <span aria-hidden="true">×</span></button>
        </div>
        <div class="gear-detail__tabs" id="gear-detail-tabs" role="group" aria-label="解説とレビューの切り替え" hidden></div>
        <div class="gear-detail__scroll" id="gear-detail-content"></div>
    </dialog>

    <footer class="footer"></footer>
